<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ten Hour Timer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="wrap">
    <div class="ring">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="track" cx="120" cy="120" r="108" pathLength="100" />
        <circle id="progress" class="progress" cx="120" cy="120" r="108" pathLength="100" />
      </svg>
      <div class="face">
        <div id="time" class="time">10:00:00</div>
        <div id="status" class="status">Ready</div>
      </div>
    </div>

    <div class="duration">
      <label class="field">
        <input id="hours" type="number" min="0" max="99" inputmode="numeric" value="10" aria-label="Hours" />
        <span>hrs</span>
      </label>
      <span class="colon">:</span>
      <label class="field">
        <input id="minutes" type="number" min="0" max="59" inputmode="numeric" value="0" aria-label="Minutes" />
        <span>min</span>
      </label>
    </div>

    <div class="actions">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
